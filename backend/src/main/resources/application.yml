spring:
  application:
    name: apartment-management-api
  datasource:
    url: ${APP_DB_URL:jdbc:sqlserver://localhost:50383;databaseName=APARTMENT_MANAGEMENT;encrypt=true;trustServerCertificate=true}
    username: ${APP_DB_USER:fast_dev}
    password: ${APP_DB_PASSWORD:fasTdev@123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-before-production-2026}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:admin}
    password: ${INITIAL_ADMIN_PASSWORD:Admin@162534}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME:Quản trị hệ thống}
