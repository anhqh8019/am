spring:
  application:
    name: apartment-management-api
  datasource:
    url: ${APP_DB_URL:jdbc:sqlserver://localhost:14333;databaseName=ApartmentManagement;encrypt=true;trustServerCertificate=true}
    username: ${APP_DB_USER:sa}
    password: ${APP_DB_PASSWORD:ChangeMe_Strong_2026!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-before-production-2026}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088,http://127.0.0.1:8088}
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:admin}
    password: ${INITIAL_ADMIN_PASSWORD:ChangeMe_Admin_2026!}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME:Quản trị hệ thống}
  payment:
    bank-code: ${PAYMENT_BANK_CODE:970415}
    bank-account: ${PAYMENT_BANK_ACCOUNT:0000000000}
    account-name: ${PAYMENT_ACCOUNT_NAME:BAN QUAN LY CHUNG CU}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:change-this-webhook-secret}
  vietqr:
    callback:
      username: ${VIETQR_CALLBACK_USERNAME:vietqr-callback}
      password: ${VIETQR_CALLBACK_PASSWORD:change-this-vietqr-callback-password}
      jwt-secret: ${VIETQR_CALLBACK_JWT_SECRET:change-this-vietqr-callback-jwt-secret-at-least-32-bytes}
      token-expiration-seconds: ${VIETQR_CALLBACK_TOKEN_EXPIRATION_SECONDS:300}
  messaging:
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    zalo-oa-access-token: ${ZALO_OA_ACCESS_TOKEN:}
